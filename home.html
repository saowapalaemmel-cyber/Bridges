<!DOCTYPE html>
<html lang="th">
  <head>
    <title>Home</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Load a font called Roboto from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=League+Spartan:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <!-- ติดตั้ง Flowbite CSS -->
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />

    <!-- Here are the CSS files for this page. -->
    <link rel="stylesheet" href="./styles/shared/header.css">
    <link rel="stylesheet" href="./styles/shared/general.css">
    <link rel="stylesheet" href="./styles/pages/home.css">

  </head>
  <body>
    <header>
      <div class="header-left-section">
        <a href="Home.html">
          <h1 class="logo">hung.</h1>
        </a>
      </div>

      <div class="header-middle-section">
        <input class="search-bar js-search-bar" type="text" placeholder="Search">

        <button class="search-button js-search-button">
          <img class="search-icon" src="images/icons/search-icon.png">
        </button>
      </div>

      <div class="header-right-section">
        <a class="cart-link" href="checkout.html">
          <img class="cart-icon" src="images/icons/cart-icon.png">
          <div class="cart-quantity js-cart-quantity"></div>
          <div class="cart-text">Cart</div>
        </a>
      </div>
    </header>

    <div class="banner-container">
      <div id="default-carousel" class="relative w-full" data-carousel="slide">

        <!-- wrapper -->
        <div class="relative h-72 overflow-hidden rounded-xl">

          <!-- item 1 -->
          <div class="hidden duration-700 ease-in-out" data-carousel-item>
            <img src="./images/banner/num-ya-poo-banner.png"
              class="absolute w-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
          </div>

          <!-- item 2 -->
          <div class="hidden duration-700 ease-in-out" data-carousel-item>
            <img src="./images/banner/kai-kole-banner.png"
              class="absolute w-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
          </div>

          <!-- item 3 -->
          <div class="hidden duration-700 ease-in-out" data-carousel-item>
            <img src="./images/banner/pad-sa-tor-banner.png"
              class="absolute w-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
          </div>

        </div>

        <!-- indicators -->
        <div class="absolute z-30 flex -translate-x-1/2 bottom-3 left-1/2 space-x-2">
          <button data-carousel-slide-to="0" class="w-2 h-2 bg-gray-400 rounded-full"></button>
          <button data-carousel-slide-to="1" class="w-2 h-2 bg-gray-400 rounded-full"></button>
          <button data-carousel-slide-to="2" class="w-2 h-2 bg-gray-400 rounded-full"></button>
        </div>

        <!-- controls -->
        <button data-carousel-prev
          class="absolute top-1/2 left-2 -translate-y-1/2 bg-white/50 p-2 rounded-full">
          ‹
        </button>

        <button data-carousel-next
          class="absolute top-1/2 right-2 -translate-y-1/2 bg-white/50 p-2 rounded-full">
          ›
        </button>

      </div>
    </div>

    <div class="main">
      <div class="menu-grid js-menu-grid">
      </div>
    </div>

    <script type="module" src="./scripts/home.js"></script>

    <!-- ติดตั้ง Flowbite JS -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
  </body>

</html>
